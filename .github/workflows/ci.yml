name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-and-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch character regression snapshots
        run: >-
          git fetch --no-tags --depth=1 origin
          8506f7b7ea3cca8d934d86e071c72af327860e97
          3f838ff9dd5145e2257b20d51b59da604c558c4a
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore backend/OpmWiki.sln
      - run: dotnet build backend/OpmWiki.sln --configuration Release --no-restore
      - run: dotnet test backend/OpmWiki.sln --configuration Release --no-build

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run test:integration
